# The image, published to GHCR on every push to main (ADR-0008).
#
# What it is for: **a copy of kanpai is run from this image**, with `compose.yaml` and a
# filled-in `.env` — no clone, no node, no build. So the image is built and published from
# the first slice rather than added at the end, and it is public, like the repository.
#
# The tag shape below is the whole contract. `main` moves on every push and is what
# `compose.yaml` pulls by default; `main-<sha>-<timestamp>` is sortable, so a deployment that
# rolls itself forward to "the newest" does a string comparison rather than a registry query,
# and a self-hoster who wants to choose when to move pins one of those instead.
#
# Nothing about where it runs is in this repository, and nothing here needs to be: the image
# is self-contained, it carries its own migrations, and `compose.yaml` is one way to run it
# that owes this workflow nothing.
#
# **Check the package's visibility once, after the first push.** A self-hoster pulls it with no
# login only if it is public, and GHCR has created packages private before now whatever the
# repository was; if so, it is one switch in the package's settings, set once.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Registers the binfmt handlers the arm64 leg below is emulated with.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main-<sha>-<unix timestamp>: the sha says which commit, the timestamp sorts.
          tags: |
            type=raw,value=main
            type=raw,value=main-{{sha}}-{{date 'X'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch, which is where this parts from tsundoku's amd64-only image: ADR-0008
          # makes the self-hoster a user, and the machines a self-hoster has to hand — an
          # Apple-silicon laptop, a Raspberry Pi, an ARM VPS — are as often arm64 as not. The
          # arm64 leg is emulated with QEMU on a GitHub runner and is the slow half of this job;
          # that is the price of `docker compose up` working on those machines without
          # `--platform` and emulation at run time.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build arguments, and no `DATABASE_URL`. The Dockerfile says why.
          cache-from: type=gha
          cache-to: type=gha,mode=max
