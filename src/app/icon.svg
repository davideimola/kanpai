<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    A PLACEHOLDER MARK: a cup, raised. kanpai has no visual identity yet, and this is the
    smallest drawing that says what the app is about until it does.

    A tab is outside this application's cascade, so the file states its own ink on both
    grounds rather than `currentColor`, which some browser chrome resolves to nothing. The
    two greys are `--ink` from `src/app/globals.css`, light and dark, in sRGB.
  -->
  <style>
    path { fill: none; stroke: #181818; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #e8e8e8; }
    }
  </style>
  <path d="M6 4h12l-1.2 7.5a4.8 4.8 0 0 1-9.6 0Z"/>
  <path d="M12 16.3V20M8.5 20h7"/>
</svg>
